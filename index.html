<style>
:root{--ink:#0E1B2C;--tg:#229ED9;--sun:#FFC24B;--soft:#C9D6E3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--ink);color:#fff;display:grid;place-items:center;padding:24px;text-align:center}
main{max-width:460px;width:100%}
h1{font-size:clamp(30px,8vw,44px);line-height:1.1;letter-spacing:-.02em;font-weight:800}
h1 span{display:block;color:var(--tg)}
p.sub{margin:14px 0 26px;color:var(--soft);font-size:18px}
.timer{width:132px;height:132px;border-radius:50%;border:6px solid var(--tg);margin:0 auto 14px;display:grid;place-items:center;font-size:64px;font-weight:800}
.msg{color:var(--soft);font-size:16px;margin-bottom:22px}
.btn{display:block;text-decoration:none;font-weight:800;padding:16px 20px;border-radius:999px;font-size:18px;margin-bottom:12px}
.tg{background:var(--tg);color:#04202E}
.wa{border:2px solid #3b516b;color:#fff}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Telegram Ads<span>Full Setup Service</span></h1>
  <p class="sub">Best leads. Aap sirf apna kaam dekho.</p>

  <div class="timer" id="t" aria-live="polite">3</div>
  <p class="msg">Telegram apne aap khul raha hai...</p>

  <a class="btn tg" id="tg" href="https://t.me/Rihcindorg" rel="noopener">Telegram kholo: @Rihcindorg</a>
  <a class="btn wa" id="wa" href="https://wa.me/918810809713?text=Namaste%2C%20mujhe%20Telegram%20ads%20service%20chahiye." rel="noopener">WhatsApp: 8810809713</a>
</main>

<script>
var TG = "https://t.me/Rihcindorg";
var left = 3, el = document.getElementById("t"), done = false;

function openTG(){
  if(done) return; done = true;
  try { fbq('track', 'Lead'); } catch(e){}
  setTimeout(function(){ window.location.href = TG; }, 300);
}
var iv = setInterval(function(){
  left--;
  if(left > 0){ el.textContent = left; }
  else { clearInterval(iv); el.textContent = "0"; openTG(); }
}, 1000);

// Buttons: track Lead on click too
document.getElementById("tg").addEventListener("click", function(){ try{ fbq('track','Lead'); }catch(e){} });
document.getElementById("wa").addEventListener("click", function(){ try{ fbq('track','Lead'); }catch(e){} });
</script>
